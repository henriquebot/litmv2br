name: Release PT-BR
# Release trigger: 14.5.402

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-ptbr.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read package version
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('system.json','utf8')).version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=ptbr-$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate package
        shell: bash
        run: |
          node -e "JSON.parse(require('fs').readFileSync('system.json','utf8')); JSON.parse(require('fs').readFileSync('lang/pt-BR.json','utf8'));"
          find module -name '*.mjs' -print0 | xargs -0 -n1 node --check
          npm ci
          npm run build

      - name: Build Foundry package
        shell: bash
        run: |
          zip -r system.zip             CHANGELOG.md LICENSE.txt README.md PTBR.md system.json package.json package-lock.json template.json             assets/ css/ fonts/ lang/ lib/ module/ packs/ src/ templates/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<EOF
          Legend In The Mist PT-BR $VERSION

          - Base oficial: MrTheBino/mist-engine-fvtt
          - Interface PT-BR
          - Solicitar Ajuda e fluxos de colaboração localizados
          - Tours e Como Jogar em PT-BR
          - Tema visual Sci-Fi opcional
          - Compêndios oficiais preservados sem tradução
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" system.json system.zip --clobber
            gh release edit "$TAG" --title "Legend In The Mist PT-BR $VERSION" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" system.json system.zip               --target main               --title "Legend In The Mist PT-BR $VERSION"               --notes-file /tmp/release-notes.md
          fi
