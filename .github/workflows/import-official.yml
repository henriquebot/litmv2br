name: Import Official Mist Engine

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/import-official.yml'
  pull_request:
    types: [opened]
    branches: [ main ]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout translation repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Import official upstream
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/import-official.yml /tmp/import-official.yml

          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/MrTheBino/mist-engine-fvtt.git
          git fetch upstream main

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          git archive upstream/main | tar -x

          mkdir -p .github/workflows
          cp /tmp/import-official.yml .github/workflows/import-official.yml

          cat > .upstream.json <<'EOF'
          {
            "repository": "MrTheBino/mist-engine-fvtt",
            "branch": "main",
            "strategy": "official-upstream-plus-ptbr-overlay"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[sync-upstream] Import official Mist Engine main"
          git push origin HEAD:main
